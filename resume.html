<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d100e">
  <meta name="description" content="Résumé of Phone Hseng, computer science student at Virginia Tech.">
  <title>Résumé — Phone Hseng</title>
  <link rel="icon" type="image/png" data-asset="avatar">

  <style>
    /* same palette as the main page so the two feel like one site */
    :root {
      color-scheme: dark;
      --paper: #0d100e;
      --ink: #ebeee6;
      --muted: #9ca598;
      --line: #2c332c;
      --accent: #bad78d;
      --soft: #2a3123;
      --card: #141913;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: 'Segoe UI', Arial, sans-serif;
      --mono: Consolas, 'Courier New', monospace;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --paper: #f7f5ee;
      --ink: #242820;
      --muted: #60645a;
      --line: #d7d8cb;
      --accent: #47632e;
      --soft: #eee4d4;
      --card: #efeee6;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a { color: inherit; text-underline-offset: 5px; }
    a:hover { color: var(--accent); }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    svg { display: block; max-width: 100%; }

    .wrap { width: min(1000px, calc(100% - 80px)); margin-inline: auto; }

    /* header */
    .site-header {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 24px;
      margin-top: 24px;
      background: var(--card);
    }

    .wordmark {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.3px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 20%;
      border: 2px solid var(--line);
      box-shadow: 0 0 0 2px var(--card);
      flex-shrink: 0;
      display: block;
    }
    .wordmark:hover .avatar { border-color: var(--accent); }

    .mark { color: var(--accent); font: italic 35px/.8 var(--serif); width: 37px; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .back { font-size: 13px; text-decoration: none; white-space: nowrap; }

    .theme-toggle {
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 4px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .theme-toggle:hover { background: var(--soft); }
    .theme-toggle svg { width: 17px; height: 17px; }

    /* title row above the document */
    .page-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 34px 0 18px;
      flex-wrap: wrap;
    }
    .page-head h1 {
      font-weight: 500;
      font-size: 34px;
      letter-spacing: -1.2px;
      margin: 0;
    }
    .page-head h1 em { font-family: var(--serif); font-weight: 400; color: var(--accent); }
    .page-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

    .download {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      background: var(--accent);
      color: var(--paper);
      border: 1px solid var(--accent);
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
    }
    .download:hover { color: var(--paper); opacity: .9; }
    .download small { font: 10px var(--mono); opacity: .75; }

    /* the document itself */
    main { flex: 1; }
    .viewer {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: var(--card);
      height: min(1180px, calc(100vh - 230px));
      min-height: 520px;
    }
    .viewer object, .viewer iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* shown when the browser will not display a pdf inline, which is common on phones */
    .fallback {
      height: 100%;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      padding: 40px 24px;
      text-align: center;
    }
    .fallback p { margin: 0; color: var(--muted); font-size: 14px; max-width: 360px; }
    .fallback svg { width: 44px; height: 44px; stroke-width: 1.3; color: var(--muted); }

    .site-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      border-top: 1px solid var(--line);
      margin-top: 34px;
      padding: 23px 0 28px;
      color: var(--muted);
      font: 10px/1.5 var(--mono);
    }

    @media (max-width: 720px) {
      .wrap { width: calc(100% - 40px); }
      .site-header { padding: 12px 18px; margin-top: 16px; gap: 12px; }
      .avatar { width: 34px; height: 34px; }
      /* the monogram is enough at this width, the full name would wrap */
      .full-name { display: none; }
      .header-right { gap: 14px; }
      .page-head { margin: 26px 0 14px; gap: 16px; }
      .page-head h1 { font-size: 28px; }
      .download { padding: 11px 16px; gap: 10px; }
      .viewer { height: calc(100vh - 300px); min-height: 420px; }
    }
  </style>
</head>

  <script>
    'use strict';

    function placeAssets() {
      // the avatar is embedded in the block at the bottom of this file
      document.querySelectorAll('[data-asset]').forEach(el => {
        const value = assets[el.dataset.asset];
        if (!value) return;
        if (el.tagName === 'IMG') el.src = value;
        else el.href = value;
      });
    }

    function setTheme(theme) {
      if (!['dark', 'light'].includes(theme)) return;
      const button = document.getElementById('theme-toggle');
      document.documentElement.dataset.theme = theme;
      button.setAttribute('aria-pressed', String(theme === 'light'));
      button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d100e' : '#f7f5ee';
    }

    function wireTheme() {
      // shares the setting with the main page so the theme carries across
      const themeButton = document.getElementById('theme-toggle');
      try { setTheme(localStorage.getItem('phone-theme')); } catch (_) {}
      themeButton.hidden = false;
      themeButton.addEventListener('click', () => {
        const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        setTheme(theme);
        try { localStorage.setItem('phone-theme', theme); } catch (_) {}
      });
    }

    // runs once the assets block below has been read
    document.addEventListener('DOMContentLoaded', () => {
      placeAssets();
      wireTheme();
      document.getElementById('year').textContent = new Date().getFullYear();
    });
  </script>
